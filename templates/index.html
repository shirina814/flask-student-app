
<!DOCTYPE html>
<html>
<head>
    <title>Flask Student Records</title>
</head>
<body>
    <h1>Student Records - Flask</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student["id"] }}</td>
            <td>{{ student["name"] }}</td>
            <td>{{ student["course"] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
